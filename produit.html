<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiche Produit — Jardin Agro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

  <header id="header" class="scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo"><i class="fa-solid fa-rose"></i> Jardin Agro</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Accueil</a></li>
          <li><a href="boutique.html" class="nav-link">Boutique</a></li>
          <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <div class="cart-icon-btn" id="cartToggle">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-count" id="cartCount">0</span>
        </div>
      </div>
    </div>
  </header>

  <main style="padding-top: 140px; padding-bottom: 80px;">
    <div class="container" style="display: flex; flex-wrap: wrap; gap: 40px; align-items: center;">
      
      <div style="flex: 1; min-width: 300px;">
        <img src="/assets/images/rose-rouge.jpg" alt="Rose Rouge Passion" style="width: 100%; border-radius: 16px; box-shadow: var(--shadow-md);">
      </div>

      <div style="flex: 1; min-width: 300px;">
        <h1 style="font-family: var(--font-title); font-size: 2.5rem; margin-bottom: 10px;">Rose Rouge Passion</h1>
        <div style="font-size: 1.8rem; font-weight: 700; color: var(--primary-red); margin-bottom: 20px;">25 $</div>
        
        <p style="color: var(--text-muted); margin-bottom: 25px;">
          Un arrangement spectaculaire de roses fraîches soigneusement sélectionnées. Parfait pour exprimer vos sentiments les plus profonds.
        </p>

        <div style="margin-bottom: 25px;">
          <label style="font-weight: 600; display: block; margin-bottom: 8px;">Quantité :</label>
          <input type="number" id="productQty" value="1" min="1" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ccc; width: 80px; font-size: 1rem;">
        </div>

        <button class="btn btn-primary" onclick="addCurrentProduct()">
          + Ajouter au panier
        </button>
      </div>

    </div>
  </main>

  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3>Votre Panier</h3>
      <div id="closeCart" style="cursor:pointer; font-size:1.2rem;"><i class="fa-solid fa-xmark"></i></div>
    </div>
    <div class="cart-body" id="cartItems"></div>
    <div class="cart-footer">
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:700;">
        <span>Total :</span>
        <span id="cartTotal">0 $</span>
      </div>
      <button class="btn btn-primary" id="whatsappOrderBtn" style="width:100%; background:#25D366; box-shadow:none;">
        <i class="fa-brands fa-whatsapp"></i> Commander sur WhatsApp
      </button>
    </div>
  </div>

  <footer>
    <div class="container">
      <div class="footer-bottom"><p>&copy; 2026 Jardin Agro. Tous droits réservés.</p></div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/cart.js"></script>
  <script>
    function addCurrentProduct() {
      const qty = parseInt(document.getElementById('productQty').value) || 1;
      cartManager.addItem({
        id: 1,
        name: 'Rose Rouge Passion',
        price: 25,
        size: 'Standard',
        qty: qty,
        image: '/assets/images/rose-rouge.jpg'
      });
    }
  </script>
</body>
</html>
